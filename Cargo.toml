[package]
name = "wpe-gallery"
default-run = "wpe-gallery"
version = "0.2.4"
edition = "2024"
license = "MIT"
description = "A GPUI gallery for Wallpaper Engine wallpapers on Linux"
repository = "https://github.com/poipoi300/wpe-gallery"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
directories = "6"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
tempfile = "3"


[profile.release]
debug = 0

[dependencies.futures]
version = "0.3"
[dependencies.smallvec]
version = "1"

# GPUI 0.2.2's tar client uses xattr 0.2.3; current libc removed Linux ENOATTR.
# blade-graphics 0.7.1 never recovered from VK_ERROR_OUT_OF_DATE_KHR, which
# NVIDIA reports after the first frame on niri (README, "Vendored patches").
[patch.crates-io]
xattr = { path = "vendor/xattr" }
blade-graphics = { path = "vendor/blade-graphics" }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"

[dependencies.sha2]
version = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies.gpui]
version = "0.2.2"
features = ["test-support"]
